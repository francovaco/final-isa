# Pipeline de ClubReservas: la app (logstash-logback-encoder) manda un JSON por linea por TCP.
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Datos de la conexion TCP que no aportan (el host de origen ya viene en los campos de la app)
  mutate {
    remove_field => ["port", "[event][original]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    # El indice tiene que empezar con "logstash-": es lo que el rol logstash_writer puede escribir
    index => "logstash-clubreservas-%{+YYYY.MM.dd}"
  }
}
