<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (deporte(); as deporteRef) {
      <div>
        <h2 data-cy="deporteDetailsHeading"><span>Deporte</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ deporteRef.id }}</span>
          </dd>
          <dt><span>Nombre</span></dt>
          <dd>
            <span>{{ deporteRef.nombre }}</span>
          </dd>
          <dt><span>Descripcion</span></dt>
          <dd>
            <span>{{ deporteRef.descripcion }}</span>
          </dd>
          <dt><span>Jugadores Por Equipo</span></dt>
          <dd>
            <span>{{ deporteRef.jugadoresPorEquipo }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Volver</span>
        </button>

        <button type="button" [routerLink]="['/deporte', deporteRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Editar</span>
        </button>
      </div>
    }
  </div>
</div>
