<div>
  <h2 id="page-heading" data-cy="DeporteHeading">
    <span>Deportes</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [animation]="isLoading ? 'spin' : undefined"></fa-icon>
        <span>Refrescar lista</span>
      </button>

      <button
        *jhiHasAnyAuthority="'ROLE_ADMIN'"
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-deporte"
        [routerLink]="['/deporte/new']"
      >
        <fa-icon icon="plus"></fa-icon>
        <span>Crear nuevo Deporte</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error />

  <jhi-alert />

  @if (deportes().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span>Ningún Deportes encontrado</span>
    </div>
  } @else {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="id">
              <div class="d-flex">
                <span>ID</span>

                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="nombre">
              <div class="d-flex">
                <span>Nombre</span>

                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="descripcion">
              <div class="d-flex">
                <span>Descripcion</span>

                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col" jhiSortBy="jugadoresPorEquipo">
              <div class="d-flex">
                <span>Jugadores Por Equipo</span>

                <fa-icon class="p-1" icon="sort"></fa-icon>
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (deporte of deportes(); track trackId(deporte)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/deporte', deporte.id, 'view']">{{ deporte.id }}</a>
              </td>
              <td>{{ deporte.nombre }}</td>
              <td>{{ deporte.descripcion }}</td>
              <td>{{ deporte.jugadoresPorEquipo }}</td>
              <td class="text-end">
                <div class="btn-group">
                  <a [routerLink]="['/deporte', deporte.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                    <fa-icon icon="eye"></fa-icon>
                    <span class="d-none d-md-inline">Vista</span>
                  </a>

                  <a
                    *jhiHasAnyAuthority="'ROLE_ADMIN'"
                    [routerLink]="['/deporte', deporte.id, 'edit']"
                    class="btn btn-primary btn-sm"
                    data-cy="entityEditButton"
                  >
                    <fa-icon icon="pencil-alt"></fa-icon>
                    <span class="d-none d-md-inline">Editar</span>
                  </a>

                  <button
                    *jhiHasAnyAuthority="'ROLE_ADMIN'"
                    type="submit"
                    (click)="delete(deporte)"
                    class="btn btn-danger btn-sm"
                    data-cy="entityDeleteButton"
                  >
                    <fa-icon icon="times"></fa-icon>
                    <span class="d-none d-md-inline">Eliminar</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
