name: pipeline

# Corre en cada pull request hacia main (antes de mergear) y en cada push a main
# (al mergear, para confirmar que main quedó en verde). Los pushes a develop u otras
# ramas de trabajo no lo disparan.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Tests automaticos del backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -ntp verify --batch-mode -Dskip.installnodenpm -Dskip.npm
      - name: Reportes de tests y cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-reportes
          path: |
            target/site/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Tests automaticos del frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Reporte de tests y cobertura (Jest)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-reportes
          path: target/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Puertas de seguridad
  # ---------------------------------------------------------------------------
  seguridad:
    name: Seguridad (SCA, SAST, secretos, config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      # SCA: vulnerabilidades HIGH/CRITICAL en las dependencias que llegan al navegador.
      - name: SCA - npm audit (audit-ci)
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

      # SAST: patrones peligrosos en el codigo.
      - name: SAST - Semgrep
        run: docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.184.0 semgrep scan --config auto --error

      # Secretos en el codigo y en el historial
      - name: Secretos - Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configuracion insegura en Dockerfiles y docker compose.
      - name: Config - Trivy
        run: docker run --rm -v "$PWD":/src aquasec/trivy:0.75.0 config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs /src/node_modules --skip-dirs /src/target /src

  # ---------------------------------------------------------------------------
  # Imagen Docker de la app (Trivy)
  # ---------------------------------------------------------------------------
  imagen:
    name: Imagen Docker (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Misma imagen que levanta el docker-compose.yml (Dockerfile multi-etapa)
      - run: docker build -t clubreservas:latest .
      - name: Contenedor - Trivy image
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore":/.trivyignore
          aquasec/trivy:0.75.0 image --ignorefile /.trivyignore
          --exit-code 1 --severity HIGH,CRITICAL clubreservas:latest

  # ---------------------------------------------------------------------------
  # Tests E2E con Playwright contra la app real (imagen Docker + PostgreSQL).
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Variables de entorno de prueba (generadas en cada corrida)
        run: |
          {
            echo "JWT_BASE64_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "ELASTIC_PASSWORD=$(openssl rand -hex 12)"
            echo "KIBANA_SYSTEM_PASSWORD=$(openssl rand -hex 12)"
            echo "LOGSTASH_INTERNAL_PASSWORD=$(openssl rand -hex 12)"
            echo "KIBANA_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } > .env
      # Solo app + base de datos (ELK no hace falta para los tests)
      - run: docker compose build app
      - run: docker compose up -d --no-deps postgresql app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Esperar a que la app esté lista
        run: timeout 180 bash -c 'until curl -sf http://localhost:8080/management/health; do sleep 3; done'
      - run: npm run e2e
      - name: Reporte de Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-reporte
          path: target/playwright/
          if-no-files-found: ignore
      - name: Logs de la app (si algo falló)
        if: failure()
        run: docker compose logs app

  # ---------------------------------------------------------------------------
  # DAST: OWASP ZAP baseline contra la app en ejecución (headers, CSP, cookies...).
  # ---------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Variables de entorno de prueba (generadas en cada corrida)
        run: |
          {
            echo "JWT_BASE64_SECRET=$(openssl rand -base64 64 | tr -d '\n')"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 12)"
            echo "ELASTIC_PASSWORD=$(openssl rand -hex 12)"
            echo "KIBANA_SYSTEM_PASSWORD=$(openssl rand -hex 12)"
            echo "LOGSTASH_INTERNAL_PASSWORD=$(openssl rand -hex 12)"
            echo "KIBANA_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } > .env
      - run: docker compose build app
      - run: docker compose up -d --no-deps --wait postgresql app
      - name: Escaneo baseline de OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: http://localhost:8080
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          cmd_options: -c .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-reporte
      - name: Logs de la app (si algo falló)
        if: failure()
        run: docker compose logs app
