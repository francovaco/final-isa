name: pipeline

# Corre en cada push (a cualquier rama) y en cada pull request hacia main.
on:
  push:
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # gitleaks-action comenta en la pull request

jobs:
  # ---------------------------------------------------------------------------
  # Tests automaticos del backend: unidad (Surefire), integracion (Failsafe,
  # con PostgreSQL en Testcontainers), ArchUnit y checkstyle.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (tests + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El frontend se valida en su propio job; aca se omite su build para ahorrar tiempo.
      - run: ./mvnw -ntp verify --batch-mode -Dskip.installnodenpm -Dskip.npm
      - name: Reportes de tests y cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reportes
          path: |
            target/site/
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Tests automaticos del frontend (Jest) + lint.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Reporte de tests y cobertura (Jest)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reportes
          path: target/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Puertas de seguridad (mismas ideas que el taller tienda-segura).
  # ---------------------------------------------------------------------------
  seguridad:
    name: Seguridad (SCA, SAST, secretos, config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # gitleaks revisa el historial
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # SCA: vulnerabilidades HIGH/CRITICAL en las dependencias que llegan al navegador.
      # Las excepciones (revisadas una por una) estan justificadas en audit-ci.jsonc.
      - name: SCA - npm audit (audit-ci)
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

      # SAST: patrones peligrosos en el codigo. Exclusiones justificadas en .semgrepignore.
      - name: SAST - Semgrep
        run: docker run --rm -v "$PWD":/src -w /src semgrep/semgrep:1.184.0 semgrep scan --config auto --error

      # Secretos en el codigo y en el historial. Allowlist (solo dev/test) en .gitleaks.toml.
      - name: Secretos - Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configuracion insegura en Dockerfiles y docker compose.
      - name: Config - Trivy
        run: docker run --rm -v "$PWD":/src aquasec/trivy:0.75.0 config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs /src/node_modules --skip-dirs /src/target /src

  # ---------------------------------------------------------------------------
  # Imagen Docker de la app (Jib) + escaneo de vulnerabilidades del contenedor.
  # ---------------------------------------------------------------------------
  imagen:
    name: Imagen Docker (Jib + Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -ntp -Pprod -DskipTests verify jib:dockerBuild --batch-mode
      # Excepciones justificadas en .trivyignore
      - name: Contenedor - Trivy image
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore":/.trivyignore
          aquasec/trivy:0.75.0 image --ignorefile /.trivyignore
          --exit-code 1 --severity HIGH,CRITICAL clubreservas:latest
